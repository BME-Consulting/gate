version: '3.8'

services:
  face-api:
    build: .
    container_name: mc-gate-face-api
    ports:
      - "8101:8101"
    environment:
      - HOST=0.0.0.0
      - PORT=8101
      - API_KEY=preview-api-key-please-rotate
      - CORS_ORIGINS=http://localhost:3000,http://192.168.1.4:8081
      - DATABASE_PATH=/app/data/embeddings.db
      - FACE_DETECTION_MODEL=hog
      - FACE_RECOGNITION_TOLERANCE=0.6
      - MAX_IMAGE_SIZE_MB=10
      - LOG_LEVEL=INFO
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - mc-gate-network

networks:
  mc-gate-network:
    driver: bridge
