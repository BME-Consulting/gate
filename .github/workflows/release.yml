name: Release

on:
  push:
    branches: [main]

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write        # タグpush/コミットに必要
      issues: write          # semantic-release用
      pull-requests: write   # semantic-release用

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 全履歴取得
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install semantic-release
        run: |
          pnpm add -D -w \
            semantic-release \
            @semantic-release/changelog \
            @semantic-release/git \
            @semantic-release/github \
            conventional-changelog-conventionalcommits

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
        run: npx semantic-release

      - name: Update app.config.ts version
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # push 用に origin を GITHUB_TOKEN 付きにする（非対話で確実に通す）
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          # app.config.ts/js を探索（先に見つかった1つを使う）
          TARGET="$(git ls-files '**/app.config.ts' '**/app.config.js' | head -n 1)"

          if [ -z "$TARGET" ]; then
            echo "❌ app.config.ts/js not found"
            echo "Available config files:"
            git ls-files | grep -E 'app\.config\.(ts|js)' || echo "None found"
            exit 1
          fi

          echo "✅ Target file: $TARGET"

          # 最新のバージョンタグを取得
          NEW_VERSION=$(git describe --tags --abbrev=0 | sed 's/^v//')

          # バージョンを更新
          sed -i "s/version: \".*\"/version: \"$NEW_VERSION\"/" "$TARGET"

          # versionCode を自動インクリメント
          CURRENT_VERSION_CODE=$(grep -oP 'versionCode: \K\d+' "$TARGET" || echo "0")
          NEW_VERSION_CODE=$((CURRENT_VERSION_CODE + 1))
          sed -i "s/versionCode: $CURRENT_VERSION_CODE/versionCode: $NEW_VERSION_CODE/" "$TARGET"

          # コミット
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$TARGET"
          git commit -m "chore: bump version to $NEW_VERSION (versionCode $NEW_VERSION_CODE) [skip ci]"
          git push
