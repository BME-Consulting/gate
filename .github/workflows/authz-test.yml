name: OAuth Authorization Tests

on:
  push:
    branches: [main]
    paths:
      - 'apps/gs-api/**'
      - '.github/workflows/authz-test.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/gs-api/**'
      - '.github/workflows/authz-test.yml'
  workflow_dispatch:

jobs:
  authz-test:
    name: OAuth Authorization E2E Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mc_gate
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'apps/gs-api/package-lock.json'

      - name: Install dependencies
        working-directory: apps/gs-api
        run: npm ci

      - name: Generate Prisma Client
        working-directory: apps/gs-api
        run: npm run prisma:generate

      - name: Run database migrations
        working-directory: apps/gs-api
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mc_gate?schema=public
        run: npm run prisma:migrate:prod

      - name: Seed database
        working-directory: apps/gs-api
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mc_gate?schema=public
        run: npm run prisma:seed

      - name: Start GS API Server
        working-directory: apps/gs-api
        env:
          NODE_ENV: development
          PORT: 7070
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mc_gate?schema=public
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          REDIS_PASSWORD: ""
          MOCK_AUTH: false
          AUTH_ISSUER: https://auth-gate-prod.bme-service.monster/realms/mcd3
          AUTH_AUDIENCE: mc-gate-mobile
          AUTH_JWKS_URL: https://auth-gate-prod.bme-service.monster/realms/mcd3/protocol/openid-connect/certs
        run: |
          npm run dev &
          sleep 5
          curl -s http://localhost:7070/health || (echo "Server failed to start" && exit 1)

      - name: Run OAuth Authorization Tests
        working-directory: apps/gs-api
        env:
          API_URL: http://localhost:7070/api/me/projects
          KC_TOKEN_URL: https://auth-gate-prod.bme-service.monster/realms/mcd3/protocol/openid-connect/token
          KC_CLIENT_ID: mc-gate-mobile
          KC_USERNAME: ${{ secrets.KC_USERNAME }}
          KC_PASSWORD: ${{ secrets.KC_PASSWORD }}
          KC_TEST_USERNAME: ${{ secrets.KC_TEST_USERNAME || 'testuser' }}
          KC_TEST_PASSWORD: ${{ secrets.KC_TEST_PASSWORD || 'test123' }}
        run: npm run test:authz

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: authz-test-results
          path: apps/gs-api/test-results/

  summary:
    name: Test Summary
    needs: authz-test
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Check test results
        run: |
          if [ "${{ needs.authz-test.result }}" == "success" ]; then
            echo "✅ OAuth Authorization tests passed"
          else
            echo "❌ OAuth Authorization tests failed"
            exit 1
          fi
