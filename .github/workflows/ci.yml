name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm lint

      - name: Run TypeScript type check
        run: pnpm type-check

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Upload test coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  build-check:
    name: Build Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Expo config
        working-directory: apps/mobile
        run: npx expo config --json > /dev/null

      - name: Check EAS configuration
        working-directory: apps/mobile
        run: |
          if [ ! -f "eas.json" ]; then
            echo "❌ eas.json not found"
            exit 1
          fi
          echo "✅ eas.json found"

      - name: Security Check - Prohibited Debug Tabs
        working-directory: apps/mobile
        run: |
          echo "🔒 Checking for prohibited debug tabs in production..."

          # Check for Tabs.Screen with prohibited names
          LAYOUT_FILE="src/app/(tabs)/_layout.tsx"

          # Search for Tab.Screen components with prohibited names
          # Pattern: <Tabs.Screen name="debug" or name="vision-test" or name="camera-test"
          FOUND=$(grep -E '<Tabs\.Screen[^>]*name="(debug|vision-test|camera-test)"' "$LAYOUT_FILE" || true)

          if [ -n "$FOUND" ]; then
            echo "❌ SECURITY ERROR: Prohibited debug tabs found in _layout.tsx!"
            echo ""
            echo "The following Tab.Screen components were detected:"
            echo "$FOUND"
            echo ""
            echo "Production builds MUST NOT include debug/vision-test/camera-test tabs."
            echo "Please remove these Tab.Screen components from $LAYOUT_FILE"
            exit 1
          fi

          echo "✅ No prohibited Tab.Screen components found"
